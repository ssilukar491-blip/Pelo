<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LELO AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0d0d12;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

.header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #292932;
}

.logo{
  font-size:30px;
  font-weight:1000;
  color:#ffe22e;
  text-shadow:3px 3px 0 #ff3c9d;
}

.chat{
  height:calc(100vh - 135px);
  overflow-y:auto;
  padding:20px 15px;
}

.message{
  max-width:82%;
  padding:12px 16px;
  margin-bottom:15px;
  border-radius:18px;
  line-height:1.5;
}

.ai{
  background:#25252e;
  margin-right:auto;
}

.user{
  background:#ff3c9d;
  margin-left:auto;
}

.input-area{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  padding:10px;
  display:flex;
  gap:8px;
  background:#17171d;
  border-top:1px solid #292932;
}

input{
  flex:1;
  border:none;
  outline:none;
  border-radius:25px;
  padding:0 18px;
  background:#292932;
  color:white;
  font-size:16px;
}

button{
  width:50px;
  border:none;
  border-radius:50%;
  background:#ffe22e;
  color:#17171d;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">LELO</div>
</div>

<div class="chat" id="chat">

  <div class="message ai">
    👋 Namaste!<br>
    Main <b>LELO</b> hoon.<br>
    Tum mujhse kuch bhi pooch sakte ho.
  </div>

</div>

<div class="input-area">

  <input
    id="messageInput"
    type="text"
    placeholder="LELO se kuch poochho..."
  >

  <button onclick="sendMessage()">➤</button>

</div>

<script>

function sendMessage(){

  let input =
    document.getElementById("messageInput");

  let text = input.value.trim();

  if(text === ""){
    return;
  }

  let userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.innerText = text;

  document.getElementById("chat")
    .appendChild(userMessage);

  input.value = "";

  setTimeout(function(){

    let aiMessage =
      document.createElement("div");

    aiMessage.className =
      "message ai";

    aiMessage.innerText =
      "LELO: Abhi mera AI brain connect nahi hua hai 🧠";

    document.getElementById("chat")
      .appendChild(aiMessage);

    document.getElementById("chat").scrollTop =
      document.getElementById("chat").scrollHeight;

  },500);
}

</script>

</body>
  </html>
